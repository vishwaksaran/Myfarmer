<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c5926">
  <title>Offline - Miraitu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f9f0 0%, #e8f5e8 50%, #dcedc8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 8px 32px rgba(44, 89, 38, 0.12);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      overflow: visible;
    }
    .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
    }
    h1 {
      color: #2c5926;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #666;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .brand {
      color: #999;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .retry-btn {
      display: inline-block;
      background: #2c5926;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #1e3d1a;
    }
    .tips {
      text-align: left;
      background: #f8faf8;
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 24px;
    }
    .tips h3 {
      font-size: 14px;
      color: #2c5926;
      margin-bottom: 8px;
    }
    .tips li {
      font-size: 13px;
      color: #777;
      margin-bottom: 4px;
      margin-left: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <img src="/miraitu-logo-icon.png" alt="Miraitu Logo">
    </div>
    <h1>You're Offline</h1>
    <p>It seems you've lost your internet connection. Don't worry — reconnect and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    <div class="brand">MIRAITU</div>
    <div class="tips">
      <h3>Quick Tips:</h3>
      <ul>
        <li>Check your Wi-Fi or mobile data</li>
        <li>Move to an area with better signal</li>
        <li>Previously visited pages may load offline</li>
      </ul>
    </div>
  </div>
</body>
</html>
