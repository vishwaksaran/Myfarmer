<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Asiatic Lion - Gujarat -->
  <rect width="80" height="80" rx="12" fill="#FFFBEB"/>
  <!-- Body -->
  <ellipse cx="40" cy="48" rx="18" ry="10" fill="#D97706"/>
  <!-- Mane -->
  <circle cx="56" cy="38" r="12" fill="#B45309"/>
  <!-- Head -->
  <circle cx="56" cy="38" r="9" fill="#D97706"/>
  <!-- Ears -->
  <circle cx="50" cy="30" r="3" fill="#B45309"/>
  <circle cx="62" cy="30" r="3" fill="#B45309"/>
  <!-- Eyes -->
  <circle cx="53" cy="36" r="2" fill="white"/>
  <circle cx="53" cy="36" r="1" fill="#1F2937"/>
  <circle cx="60" cy="36" r="2" fill="white"/>
  <circle cx="60" cy="36" r="1" fill="#1F2937"/>
  <!-- Nose -->
  <ellipse cx="57" cy="40" rx="2.5" ry="1.5" fill="#92400E"/>
  <!-- Mouth -->
  <path d="M55 42 Q57 44 59 42" stroke="#92400E" stroke-width="1" fill="none"/>
  <!-- Whiskers -->
  <line x1="50" y1="40" x2="44" y2="38" stroke="#B45309" stroke-width="0.5"/>
  <line x1="50" y1="41" x2="44" y2="41" stroke="#B45309" stroke-width="0.5"/>
  <line x1="64" y1="40" x2="70" y2="38" stroke="#B45309" stroke-width="0.5"/>
  <line x1="64" y1="41" x2="70" y2="41" stroke="#B45309" stroke-width="0.5"/>
  <!-- Legs -->
  <rect x="26" y="55" width="5" height="9" rx="1.5" fill="#B45309"/>
  <rect x="34" y="55" width="5" height="9" rx="1.5" fill="#B45309"/>
  <rect x="44" y="55" width="5" height="9" rx="1.5" fill="#B45309"/>
  <rect x="52" y="55" width="5" height="9" rx="1.5" fill="#B45309"/>
  <!-- Tail -->
  <path d="M22 46 Q14 40 16 32" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="16" cy="31" r="2.5" fill="#B45309"/>
</svg>
