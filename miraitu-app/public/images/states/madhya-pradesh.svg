<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Tiger - Madhya Pradesh -->
  <rect width="80" height="80" rx="12" fill="#FFFBEB"/>
  <!-- Body -->
  <ellipse cx="38" cy="48" rx="16" ry="10" fill="#F59E0B"/>
  <!-- Stripes on body -->
  <line x1="30" y1="42" x2="32" y2="52" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="40" x2="37" y2="52" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="40" x2="41" y2="52" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="42" x2="46" y2="52" stroke="#92400E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="56" cy="42" r="9" fill="#F59E0B"/>
  <!-- Ears -->
  <circle cx="51" cy="34" r="3" fill="#F59E0B"/>
  <circle cx="51" cy="34" r="1.5" fill="#FDE68A"/>
  <circle cx="61" cy="34" r="3" fill="#F59E0B"/>
  <circle cx="61" cy="34" r="1.5" fill="#FDE68A"/>
  <!-- Face stripes -->
  <line x1="53" y1="37" x2="52" y2="41" stroke="#92400E" stroke-width="1" stroke-linecap="round"/>
  <line x1="59" y1="37" x2="60" y2="41" stroke="#92400E" stroke-width="1" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="53" cy="41" r="1.5" fill="white"/>
  <circle cx="53" cy="41" r="0.8" fill="#1F2937"/>
  <circle cx="59" cy="41" r="1.5" fill="white"/>
  <circle cx="59" cy="41" r="0.8" fill="#1F2937"/>
  <!-- Nose -->
  <ellipse cx="56" cy="44" rx="2" ry="1.2" fill="#92400E"/>
  <!-- Mouth -->
  <path d="M54.5 45.5 Q56 47 57.5 45.5" stroke="#92400E" stroke-width="0.8" fill="none"/>
  <!-- Legs -->
  <rect x="26" y="55" width="4" height="8" rx="1" fill="#D97706"/>
  <rect x="34" y="55" width="4" height="8" rx="1" fill="#D97706"/>
  <rect x="42" y="55" width="4" height="8" rx="1" fill="#D97706"/>
  <rect x="48" y="55" width="4" height="8" rx="1" fill="#D97706"/>
  <!-- Tail -->
  <path d="M22 46 Q16 38 20 32" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="20" cy="31" r="2" fill="#92400E"/>
</svg>
