<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Charminar - Telangana -->
  <rect width="80" height="80" rx="12" fill="#EDE9FE"/>
  <!-- Base -->
  <rect x="14" y="58" width="52" height="4" rx="1" fill="#5B21B6"/>
  <!-- Main structure -->
  <rect x="20" y="34" width="40" height="24" rx="1" fill="#7C3AED"/>
  <!-- Central arch -->
  <path d="M34 58 V44 Q40 38 46 44 V58" fill="#DDD6FE"/>
  <!-- Side arches -->
  <path d="M22 58 V48 Q26 44 30 48 V58" fill="#DDD6FE"/>
  <path d="M50 58 V48 Q54 44 58 48 V58" fill="#DDD6FE"/>
  <!-- Top parapet -->
  <rect x="18" y="30" width="44" height="4" rx="1" fill="#6D28D9"/>
  <!-- Decorative row -->
  <rect x="22" y="36" width="3" height="4" rx="0.5" fill="#DDD6FE"/>
  <rect x="28" y="36" width="3" height="4" rx="0.5" fill="#DDD6FE"/>
  <rect x="50" y="36" width="3" height="4" rx="0.5" fill="#DDD6FE"/>
  <rect x="56" y="36" width="3" height="4" rx="0.5" fill="#DDD6FE"/>
  <!-- Four minarets -->
  <!-- Front left -->
  <rect x="18" y="18" width="4" height="16" rx="1" fill="#8B5CF6"/>
  <circle cx="20" cy="16" r="3" fill="#7C3AED"/>
  <line x1="20" y1="13" x2="20" y2="8" stroke="#6D28D9" stroke-width="1"/>
  <circle cx="20" cy="7" r="1.5" fill="#A78BFA"/>
  <!-- Front right -->
  <rect x="58" y="18" width="4" height="16" rx="1" fill="#8B5CF6"/>
  <circle cx="60" cy="16" r="3" fill="#7C3AED"/>
  <line x1="60" y1="13" x2="60" y2="8" stroke="#6D28D9" stroke-width="1"/>
  <circle cx="60" cy="7" r="1.5" fill="#A78BFA"/>
  <!-- Back left -->
  <rect x="28" y="20" width="3.5" height="14" rx="1" fill="#8B5CF6"/>
  <circle cx="29.75" cy="18.5" r="2.5" fill="#7C3AED"/>
  <line x1="29.75" y1="16" x2="29.75" y2="12" stroke="#6D28D9" stroke-width="1"/>
  <circle cx="29.75" cy="11" r="1.2" fill="#A78BFA"/>
  <!-- Back right -->
  <rect x="48.5" y="20" width="3.5" height="14" rx="1" fill="#8B5CF6"/>
  <circle cx="50.25" cy="18.5" r="2.5" fill="#7C3AED"/>
  <line x1="50.25" y1="16" x2="50.25" y2="12" stroke="#6D28D9" stroke-width="1"/>
  <circle cx="50.25" cy="11" r="1.2" fill="#A78BFA"/>
</svg>
