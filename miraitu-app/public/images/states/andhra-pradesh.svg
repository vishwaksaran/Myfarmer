<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Amaravati Stupa / Tirupati - Andhra Pradesh -->
  <rect width="80" height="80" rx="12" fill="#FFF7ED"/>
  <!-- Mountain/hill background -->
  <path d="M10 60 L30 30 L50 55 L65 35 L80 60" fill="#D1FAE5" opacity="0.5"/>
  <!-- Base platform -->
  <rect x="16" y="58" width="48" height="4" rx="1" fill="#92400E"/>
  <!-- Stupa dome -->
  <ellipse cx="40" cy="46" rx="18" ry="14" fill="#F59E0B"/>
  <!-- Top harmika (square railing) -->
  <rect x="35" y="30" width="10" height="6" rx="1" fill="#D97706"/>
  <!-- Chattra (umbrella) -->
  <line x1="40" y1="30" x2="40" y2="16" stroke="#92400E" stroke-width="1.5"/>
  <ellipse cx="40" cy="18" rx="6" ry="2" fill="#B45309"/>
  <ellipse cx="40" cy="22" rx="5" ry="1.5" fill="#B45309"/>
  <ellipse cx="40" cy="25" rx="4" ry="1.5" fill="#B45309"/>
  <!-- Gateway (torana) -->
  <rect x="20" y="40" width="3" height="18" rx="0.5" fill="#B45309"/>
  <rect x="57" y="40" width="3" height="18" rx="0.5" fill="#B45309"/>
  <rect x="18" y="38" width="7" height="3" rx="0.5" fill="#92400E"/>
  <rect x="55" y="38" width="7" height="3" rx="0.5" fill="#92400E"/>
  <!-- Decorative band on stupa -->
  <path d="M24 50 Q40 42 56 50" stroke="#B45309" stroke-width="1" fill="none"/>
  <path d="M26 54 Q40 48 54 54" stroke="#B45309" stroke-width="1" fill="none"/>
</svg>
