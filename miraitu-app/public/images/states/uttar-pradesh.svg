<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Taj Mahal - Uttar Pradesh -->
  <rect width="80" height="80" rx="12" fill="#F0FDF4"/>
  <!-- Base platform -->
  <rect x="12" y="58" width="56" height="4" rx="1" fill="#6B7280"/>
  <rect x="16" y="54" width="48" height="4" rx="1" fill="#9CA3AF"/>
  <!-- Main building -->
  <rect x="26" y="34" width="28" height="20" rx="1" fill="#E5E7EB"/>
  <!-- Central dome -->
  <ellipse cx="40" cy="28" rx="12" ry="10" fill="#D1D5DB"/>
  <circle cx="40" cy="18" r="2" fill="#059669"/>
  <line x1="40" y1="16" x2="40" y2="12" stroke="#059669" stroke-width="1.5"/>
  <!-- Arch -->
  <path d="M34 54 V42 Q40 35 46 42 V54" fill="#9CA3AF"/>
  <!-- Side minarets -->
  <rect x="16" y="36" width="5" height="18" rx="1" fill="#D1D5DB"/>
  <circle cx="18.5" cy="34" r="3" fill="#E5E7EB"/>
  <line x1="18.5" y1="31" x2="18.5" y2="28" stroke="#059669" stroke-width="1"/>
  <rect x="59" y="36" width="5" height="18" rx="1" fill="#D1D5DB"/>
  <circle cx="61.5" cy="34" r="3" fill="#E5E7EB"/>
  <line x1="61.5" y1="31" x2="61.5" y2="28" stroke="#059669" stroke-width="1"/>
  <!-- Small domes on building -->
  <ellipse cx="30" cy="33" rx="4" ry="3" fill="#D1D5DB"/>
  <ellipse cx="50" cy="33" rx="4" ry="3" fill="#D1D5DB"/>
</svg>
