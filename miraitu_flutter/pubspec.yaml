name: miraitu_flutter
description: Miraitu - India's #1 Agriculture Super App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  provider: ^6.1.1
  go_router: ^13.2.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  shimmer: ^3.0.0
  lottie: ^3.1.0
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
